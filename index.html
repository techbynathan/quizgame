<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Quiz Game</h1>
        </div>

        <!-- Settings & Question Display Box -->
        <div class="quiz-box">
            <!-- Settings Section -->
            <div id="settingsSection" class="settings-section">
                <h2>Game Settings</h2>
                
                <div class="setting-group">
                    <label for="sourceSelect">Question Source:</label>
                    <select id="sourceSelect">
                        <option value="default">Default Questions</option>
                        <option value="custom">Custom Questions</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="difficultySelect">Difficulty:</label>
                    <select id="difficultySelect">
                        <option value="medium">Medium (15 attempts)</option>
                        <option value="hard">Hard (10 attempts)</option>
                        <option value="insane">Insane (2 attempts)</option>
                    </select>
                </div>

                <button id="startBtn" class="btn-primary">Start Quiz</button>
            </div>

            <!-- Custom Questions Creation Section -->
            <div id="customQuestionsSection" class="custom-questions-section" style="display: none;">
                <h2>Create Custom Questions</h2>
                
                <div id="customQuestionsList"></div>

                <div class="add-question-form">
                    <input type="text" id="questionInput" placeholder="Enter your question">
                    <input type="text" id="choiceAInput" placeholder="Choice A">
                    <input type="text" id="choiceBInput" placeholder="Choice B">
                    <input type="text" id="choiceCInput" placeholder="Choice C">
                    <input type="text" id="choiceDInput" placeholder="Choice D">
                    
                    <select id="correctAnswerSelect">
                        <option value="">Select Correct Answer</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>

                    <button id="addQuestionBtn" class="btn-secondary">Add Question</button>
                </div>

                <button id="finishCustomBtn" class="btn-primary">Start Quiz with Custom Questions</button>
            </div>

            <!-- Quiz Session Section -->
            <div id="quizSection" class="quiz-session" style="display: none;">
                <div class="quiz-header">
                    <div class="score-info">
                        <span>Score: <span id="currentScore">0</span>/<span id="totalQuestions">0</span></span>
                        <span>Attempts Left: <span id="attemptsLeft">0</span></span>
                    </div>
                </div>

                <!-- Question Display Box -->
                <div class="question-box">
                    <div class="question-number">Question <span id="questionNumber">1</span></div>
                    <h3 id="questionText"></h3>
                </div>

                <!-- Answer Input Box -->
                <div class="answer-box">
                    <div class="choices" id="choicesContainer"></div>
                    
                    <div class="answer-input-group">
                        <input type="text" id="answerInput" placeholder="Enter A, B, C, or D" maxlength="1">
                        <button id="submitAnswerBtn" class="btn-primary">Submit Answer</button>
                    </div>

                    <div id="feedbackMessage" class="feedback-message"></div>
                </div>
            </div>

            <!-- Quiz Complete Section -->
            <div id="completeSection" class="complete-section" style="display: none;">
                <h2>Quiz Complete! 🎉</h2>
                <div class="final-score">
                    <p>Final Score: <span id="finalScore">0</span>/<span id="finalTotal">0</span></p>
                    <p id="scorePercentage"></p>
                </div>
                <button id="restartBtn" class="btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
